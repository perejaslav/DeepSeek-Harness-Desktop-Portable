name: ci

# Two tiers, per ТЗ §22: the Linux job is the fast gate that runs on every push
# and pull request, and the Windows job adds the parts that only make sense on
# the target platform (real Electron boot, real packaging). A broken Windows
# job must not block the quick signal, and vice versa.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-ci:
    name: fast-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
        run: npm ci

      - name: Lint
        # The upstream project has no linter yet; run one if it is ever added
        # rather than failing the job on a missing script.
        run: |
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          else
            echo "no lint script configured — skipping"
          fi

      - name: Tests
        run: npm run tests

      - name: Upstream DSH update check
        # Informational: the dedicated workflow owns PR creation (§24–§27).
        continue-on-error: true
        run: node scripts/check-dsh-update.mjs

  windows-integration:
    name: windows-integration
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
        run: npm ci

      - name: Tests
        run: npm run tests

      - name: Boot smoke test
        # Starts the real Electron app against a throwaway DSH home and asserts
        # it reaches `ready` on the pinned runtime with no plugin failures.
        run: npm run smoke

      - name: Packaging dry run
        # Catches asar/symlink problems without paying for NSIS compression.
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
        run: npm run dist:dir
