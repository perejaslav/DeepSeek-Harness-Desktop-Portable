name: windows-build

# Builds the Windows installers and keeps them as workflow artifacts (ТЗ §23).
# This is the "can we still ship?" job — it runs on demand and on every push to
# the default branch, but it never publishes a GitHub Release. Publishing is the
# release workflow's job, and only from a version tag.
#
# The full test suite and the boot smoke test run first, so a red artifact set
# is impossible: `npm run dist` is only reached once the app has actually booted
# on the pinned DSH runtime.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build installers
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
        run: npm ci

      - name: Tests
        run: npm run tests

      - name: Boot smoke test
        run: npm run smoke

      - name: Build installers
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
        run: npm run dist

      - name: Verify the bundle carries the pinned runtime
        shell: pwsh
        run: ./scripts/verify-bundle-runtime.ps1 -OutDir release

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem release -File | Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.yml
