name: release

# Publishes a GitHub Release from a version tag. Nothing here runs on ordinary
# pushes — `windows-build.yml` covers that — and the release is gated on the
# full test suite plus a real boot of the app (ТЗ §23: never publish when the
# tests did not pass).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package version
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$v") {
            throw "tag '$env:GITHUB_REF_NAME' does not match package.json version 'v$v'"
          }
          Write-Output "building version $v"

      - name: Install dependencies
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
        run: npm ci

      - name: Tests
        run: npm run tests

      - name: Boot smoke test
        run: npm run smoke

      - name: Build installers
        env:
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/
        run: npm run dist

      - name: Verify the bundle carries the pinned runtime
        shell: pwsh
        run: |
          $manifest = Get-Content dsh-runtime.json -Raw | ConvertFrom-Json
          $bundled = Get-Content release/win-unpacked/resources/app.asar.unpacked/node_modules/@deepseek-ai/dsh/package.json -Raw | ConvertFrom-Json
          if ($bundled.version -ne $manifest.version) {
            throw "packaged runtime is $($bundled.version), manifest pins $($manifest.version)"
          }
          Write-Output "packaged dsh $($bundled.version) matches the manifest"

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem release -File | Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/*.yml
          generate_release_notes: true
